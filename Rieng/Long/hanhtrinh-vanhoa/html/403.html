<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 – Không có quyền | Hành trình văn hóa</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">HT</span> Hành Trình Văn Hóa</a>
      <nav class="nav-main">
        <a href="index.html">Trang chủ</a>
        <a href="explorer-story-discovery.html">Khám phá</a>
        <a href="creator-dashboard.html">Nghệ nhân</a>
        <a href="admin-culture-dashboard.html">Quản trị viên</a>
      </nav>
      <div class="header-actions"><button class="menu-toggle" aria-label="Menu">☰</button></div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width:560px;">
      <div class="card" style="padding:2.5rem;text-align:center;margin-top:2rem;">
        <div style="font-size:4rem;line-height:1;margin-bottom:0.5rem;" aria-hidden="true">🚫</div>
        <h1 style="font-size:2.5rem;margin:0 0 0.5rem;">403</h1>
        <p class="subtitle" style="margin-bottom:1rem;">Bạn không có quyền truy cập trang này</p>
        <p class="text-muted mb-2" id="role-hint">Trang yêu cầu vai trò phù hợp. Hãy đăng nhập bằng tài khoản có quyền hoặc quay về khu vực của bạn.</p>
        <div class="flex gap-1" style="justify-content:center;flex-wrap:wrap;">
          <a href="index.html" class="btn btn-primary">Về trang chủ</a>
          <a href="login.html" class="btn btn-outline" id="btn-login">Đăng nhập</a>
          <button type="button" class="btn btn-ghost" id="btn-back">Quay lại</button>
        </div>
        <div class="mt-3 text-muted" style="font-size:0.85rem;" id="user-info"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><div class="footer-bottom" style="border:none;margin:0;padding:0;">© 2026 CultureTrail</div></div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById('btn-back').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.href = 'index.html';
    });

    const user = API.getCurrentUser();
    const info = document.getElementById('user-info');
    const hint = document.getElementById('role-hint');
    if (user) {
      info.textContent = 'Đang đăng nhập: ' + user.name + ' (' + user.role + ')';
      document.getElementById('btn-login').style.display = 'none';
      const map = {
        explorer: 'explorer-story-discovery.html',
        creator: 'creator-dashboard.html',
        curator: 'curator-content-review.html',
        admin: 'admin-culture-dashboard.html'
      };
      const home = map[user.role] || 'index.html';
      hint.innerHTML = 'Vai trò <strong>' + escapeHtml(user.role) + '</strong> không được phép mở trang này. <a href="' + home + '">Về khu vực của bạn</a>.';
    } else {
      info.textContent = 'Bạn chưa đăng nhập.';
    }
  </script>
</body>
</html>
