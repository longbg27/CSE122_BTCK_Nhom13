<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký – Hành Trình Văn Hóa</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">HT</span>
        Hành Trình Văn Hóa
      </a>
      <div class="header-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Đăng nhập</a>
        <button class="menu-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 2rem;">
        <h1 class="text-center mb-1">Đăng ký</h1>
        <p class="text-muted text-center mb-3">Tạo tài khoản Hành Trình Văn Hóa miễn phí</p>

        <div id="alert-box"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Họ và tên</label>
            <input type="text" id="name" class="form-control" required placeholder="Nguyễn Văn A">
            <div class="form-error">Vui lòng nhập họ tên.</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" required placeholder="you@example.com">
            <div class="form-error">Vui lòng nhập email hợp lệ.</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu</label>
            <input type="password" id="password" class="form-control" required placeholder="Ít nhất 6 ký tự">
            <div class="form-error">Mật khẩu tối thiểu 6 ký tự.</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Nhập lại mật khẩu</label>
            <input type="password" id="confirm" class="form-control" required placeholder="••••••••">
            <div class="form-error">Mật khẩu nhập lại không khớp.</div>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng ký</button>
        </form>

        <p class="text-center text-muted mt-2" style="font-size: 0.9rem;">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; margin: 0; padding: 0;">
        © 2026 Hành Trình Văn Hóa – BTL CSE122
      </div>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function setError(id, msg) {
      const el = document.getElementById(id);
      el.classList.add('is-invalid');
      const err = el.parentElement.querySelector('.form-error');
      if (err && msg) err.textContent = msg;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      form.querySelectorAll('.form-control').forEach(f => f.classList.remove('is-invalid'));

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      let ok = true;
      if (!name) { setError('name', 'Vui lòng nhập họ tên.'); ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('email', 'Vui lòng nhập email hợp lệ.'); ok = false; }
      if (password.length < 6) { setError('password', 'Mật khẩu tối thiểu 6 ký tự.'); ok = false; }
      if (confirm !== password) { setError('confirm', 'Mật khẩu nhập lại không khớp.'); ok = false; }
      if (!ok) return;

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Đang đăng ký...';

      await delay(600);
      const result = await API.register({ name, email, password });

      if (result.success) {
        alertBox.innerHTML = '<div class="alert alert-success">Đăng ký thành công! Đang chuyển hướng...</div>';
        setTimeout(() => { location.href = 'explorer-story-discovery.html'; }, 800);
      } else {
        alertBox.innerHTML = `<div class="alert alert-error">${result.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Đăng ký';
      }
    });
  </script>
</body>
</html>
